name: ${COMPOSE_PROJECT_NAME:-flux-showcase}

services:
  web:
    image: flux-web:${FLUX_TAG:?set FLUX_TAG to a release tag}
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      APP_ORIGIN: https://${FLUX_DOMAIN:?set FLUX_DOMAIN}
      FLUX_SHOWCASE_ONLY: "true"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      FLUX_DOMAIN: ${FLUX_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.showcase:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on: { web: { condition: service_healthy } }
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  certificates:
  caddy-config:
