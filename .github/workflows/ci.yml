name: Verify Flux
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.3", cache: npm }
      - run: npm ci
      - name: Configure isolated development tests
        run: |
          mkdir -p /tmp/opencode
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');fs.writeFileSync('.env',fs.readFileSync('.env.example','utf8').replace('replace-this-with-a-random-secret-at-least-32-characters',crypto.randomBytes(32).toString('hex')),{mode:0o600})"
          docker compose up -d --wait
          npm run db:generate
          npm run db:migrate
      - run: npm run typecheck
      - run: npm run test:private
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
        env: { FLUX_TEST_FIREFOX: "true" }
      - run: npm run test:release
      - run: npm run test:release:private
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
            /tmp/opencode/flux-release-*/diagnostics/
          retention-days: 7
      - name: Stop local test infrastructure
        if: always()
        run: docker compose down
