version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
